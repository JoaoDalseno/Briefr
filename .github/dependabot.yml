version: 2

updates:
  # ── Dependências npm ─────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    # Agrupa por tipo para reduzir ruído no PR list
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    # Major versions requerem revisão manual — mudanças breaking
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    # Labels para facilitar triagem nos PRs
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: 'chore(deps)'

  # ── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      - automated
    commit-message:
      prefix: 'chore(ci)'
