name: Security

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Cancela runs duplicadas no mesmo branch/PR
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. npm audit ────────────────────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high+ vulnerabilities fail the build)
        run: npm audit --audit-level=high

  # ── 2. Gitleaks — scan completo do histórico ─────────────────────────────────
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 é obrigatório para o gitleaks escanear TODO o histórico.
          # Com fetch-depth padrão (1), só o último commit seria verificado.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE necessário apenas para repos privados no plano pago.
          # Para repos públicos ou uso pessoal, pode ser omitido.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── 3. ESLint com regras de segurança ────────────────────────────────────────
  eslint-security:
    name: ESLint Security Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security lint
        run: npm run lint:security

  # ── 4. TypeScript strict check ───────────────────────────────────────────────
  typescript:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler (no emit)
        run: npx tsc --noEmit

  # ── 5. Secret pattern scan (custom regex) ────────────────────────────────────
  check-secrets:
    name: Custom Secret Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scan for secret patterns
        run: npm run check:secrets
