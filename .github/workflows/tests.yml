name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # TODO: substituir por `npm test` quando os testes forem implementados.
      # Sugestão de stack de testes para este projeto:
      #   - Vitest (unit tests — lib/validations, lib/stripe/plans, prompts)
      #   - Playwright (E2E — fluxo de auth, geração de brief, checkout)
      - name: Placeholder — testes ainda não implementados
        run: echo "Testes a implementar. Ver docs/testing-plan.md"

  # Build check — garante que o projeto compila sem erros antes de qualquer merge
  build:
    name: Next.js Build Check
    runs-on: ubuntu-latest
    env:
      # Valores dummy para satisfazer validações de env em build time.
      # NUNCA use chaves reais aqui.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      NEXT_PUBLIC_STRIPE_PRO_PRICE_ID: price_placeholder_pro
      NEXT_PUBLIC_STRIPE_AGENCY_PRICE_ID: price_placeholder_agencia

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
